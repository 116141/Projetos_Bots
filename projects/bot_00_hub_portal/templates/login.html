<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MultiBot Master Command Center</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: var(--bg-dark);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(18, 26, 45, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .login-header {
      text-align: center;
    }
    .login-logo {
      width: 60px;
      height: 60px;
      background: var(--primary-gradient);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px auto;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.35);
    }
    .login-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .login-header p {
      font-size: 13px;
      color: var(--text-muted);
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-group label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }
    .form-control {
      background: rgba(10, 15, 26, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
    }
    .form-control:focus {
      border-color: #00f2fe;
    }
    .btn-login {
      padding: 14px;
      background: var(--primary-gradient);
      color: #fff;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s ease;
    }
    .btn-login:hover {
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }
    .error-box {
      background: rgba(255, 82, 82, 0.15);
      border: 1px solid #ff5252;
      color: #ff5252;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">⚡</div>
      <h1>MultiBot Master</h1>
      <p>Autenticação & Gestão de Acesso</p>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Utilizador</label>
        <input type="text" class="form-control" id="inputUsername" placeholder="ex: admin ou operador" required>
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label>Palavra-passe</label>
        <input type="password" class="form-control" id="inputPassword" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-login">🔑 Entrar no Sistema</button>
    </form>

    <div style="text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 10px;">
      <p>Contas predefinidas de demonstração:</p>
      <p style="margin-top: 4px;"><strong>Admin:</strong> admin / admin123</p>
      <p><strong>Operador:</strong> operador / operador123</p>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('inputUsername').value;
      const password = document.getElementById('inputPassword').value;
      const errorBox = document.getElementById('errorBox');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (data.status === 'success') {
          window.location.href = '/';
        } else {
          errorBox.style.display = 'block';
          errorBox.innerText = data.message || 'Erro ao efetuar login!';
        }
      } catch (err) {
        errorBox.style.display = 'block';
        errorBox.innerText = 'Erro ao ligar ao servidor de autenticação!';
      }
    });
  </script>
</body>
</html>
