<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot 07: Airdrop Farmer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header>
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-parachute-box"></i>
            </div>
            <div>
                <h1>Bot 07: Airdrop Farmer</h1>
                <p>Ghost Wallets & On-Chain Activity Simulator</p>
            </div>
        </div>
        <div class="badge offline" id="statusBadge">
            <i class="fa-solid fa-power-off"></i> OFFLINE
        </div>
    </header>

    <div class="dashboard-grid">
        <div class="card">
            <h2 style="margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-wallet"></i> Carteiras Sybil (Testnet: <span id="networkName" style="color:var(--accent-primary)">Sepolia</span>)</h2>
            <div style="margin-bottom: 15px;">
                <button id="btnGenerate" class="btn btn-outline"><i class="fa-solid fa-plus"></i> Gerar +3 Carteiras</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Endereço Público (Address)</th>
                        <th>Saldo (ETH)</th>
                        <th>Nº Transações (Volume)</th>
                    </tr>
                </thead>
                <tbody id="walletTableBody">
                    <tr><td colspan="3" style="text-align:center;">A carregar...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="card" style="display: flex; flex-direction: column;">
            <h2 style="margin-bottom: 15px; font-size: 16px;"><i class="fa-solid fa-terminal"></i> Terminal do Farmer</h2>
            
            <div class="logs-container" id="logsContainer" style="flex-grow: 1; margin-bottom: 20px;">
                <!-- Logs will be injected here -->
            </div>

            <button id="btnToggle" class="btn btn-primary">
                <i class="fa-solid fa-play"></i> INICIAR FARMING
            </button>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
