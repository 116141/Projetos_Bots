    plan: free
    buildCommand: cd projects/bot_02_afiliados_telegram && pip install -r requirements.txt
    startCommand: cd projects/bot_02_afiliados_telegram && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
