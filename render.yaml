services:
  # --------------------------------------------------
  # 00. Master Hub Portal
  # --------------------------------------------------
  - type: web
    name: bot-00-hub-portal
    env: python
    region: frankfurt
    plan: free
    buildCommand: cd projects/bot_00_hub_portal && pip install -r requirements.txt
    startCommand: cd projects/bot_00_hub_portal && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # --------------------------------------------------
  # 01. Bot QuantTrader AI (Trading Crypto)
  # --------------------------------------------------
  - type: web
    name: bot-01-trading-crypto
    env: python
    region: frankfurt
    plan: free
    buildCommand: cd projects/bot_01_trading_crypto && pip install -r requirements.txt
    startCommand: cd projects/bot_01_trading_crypto && gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

